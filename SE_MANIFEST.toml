# ============================================================
# SE_MANIFEST.toml (Repository Declaration)
# ============================================================

schema = "se-manifest-schema"
schema_version = "0.5.0"
schema_url = "https://raw.githubusercontent.com/structural-explainability/se-manifest-schema/main/manifest-schema.toml"

# === Framework Context ===

[meta]
framework = "Structural Explainability"
framework_url = "https://github.com/structural-explainability"
purpose = "Declares this repository's role in the Structural Explainability ecosystem."

# === Repository Identity ===

[repository]
organization = "structural-explainability"
name = "paper-210-operational-identity"
class = "paper"
kind = "paper"
status = "draft"
since = "2026"
summary = "Defines operational identity partitions and a finite audit comparing the identity regime declared by a record system with the identity-relevant treatment induced by examined implementation surfaces."

# === Layer Position ===

[layer]
space = "structural-explainability"
role = "justification-conformance"

# === Dependency Declarations ===

[depends]
required = [
    { repository = "paper-100-neutral-substrate", kind = "semantic", reason = "Uses the stable-reference requirement, neutrality-by-design constraint, attribution boundary, and distinction between foundational reference and downstream interpretation established in Neutral Substrates." },
    { repository = "paper-200-identity-regimes", kind = "semantic", reason = "Uses candidate identity bases and transformation contrasts as motivating examples. The general audit accepts supplied equivalence relations and does not require a fixed regime inventory or family-level classifications to license identity continuation." },
]
optional = [
    { repository = "se-theory-operational-identity", kind = "semantic", reason = "Lean 4 formalization of the audit kernel (declared relation, surfaces, faithfulness, divergence witnesses, composition, local position, finite check, verdict) against which this paper's definitions are stated." },
    { repository = "se-theory-persistence", kind = "semantic", reason = "Generated identity relations and step-level licences used to state faithfulness over history-generated declarations." },
]

# === Provided Artifacts ===

[provides]
artifacts = [
    ".annotations/annotations.md",
    "CITATION.cff",
    "LICENSE",
    "README.md",
    "SE_MANIFEST.toml",
    "se210-operational-identity.tex",
]

# === Scope ===

[scope]
includes = [
    "supplied declared identity relations and partitions",
    "history-derived declared relations from individually licensed continuation steps",
    "separation of declared identity, operational treatment, and referent identity",
    "explicit scientific warrants for interpreting formal audit inputs",
    "operational identity partitions",
    "implementation-induced identity-relevant treatment",
    "mechanism registries",
    "joint mechanisms",
    "examined audit-surface families",
    "identity-relevant outcome types",
    "record-indexed identity-treatment signatures",
    "surface-control factorization",
    "faithfulness as containment of the declared relation in operational treatment equivalence",
    "finite divergence witnesses",
    "edge characterization of faithfulness for history-generated declarations",
    "conditional divergence positioning relative to a supplied alternative identity criterion",
    "sibling-aligned divergence",
    "sub-sibling divergence",
    "super-sibling divergence",
    "sibling-incomparable divergence",
    "global partition equality relative to a supplied alternative identity criterion",
    "conditional interpretation of global partition equality as regime substitution",
    "store operational partitions",
    "composition of surface faithfulness",
    "three-valued audit verdicts under explicit preconditions and warrants",
    "finite decidability under explicit decidability assumptions",
    "audit verdicts relative to supplied declarations, domains, surfaces, uses, and applicable histories",
    "non-monotonicity of passing verdicts under extension of licensed history-generated declarations",
    "registry-completeness claims",
    "examined-family-completeness claims",
    "use-completeness claims",
    "omitted-mechanism witnesses",
    "omitted-surface witnesses",
    "omitted-use witnesses",
    "disclosure-relative audit boundaries",
    "generic operational-identity interface with optional alternative identity criteria",
    "reevaluation following changes to declared relations, licences, histories, or examined implementation behavior",
    "conditional legal-alignment worked example with stipulated identity warrants",
    "identity-relevant mechanisms illustrated through provenance, schema, workflow, configuration, and versioning artifacts",
]

excludes = [
    "selection of the substantively correct identity regime",
    "certification that a declared identity basis is semantically correct",
    "proof that a mechanism registry is complete",
    "proof that an examined surface family is complete",
    "proof that all identity-relevant uses have been identified",
    "automatic discovery of arbitrary implementation mechanisms",
    "automatic identity continuation from neutral or identity-ignoring transformation classifications",
    "unconditional identity continuation from transformation-family labels",
    "inference that local sibling alignment proves global regime substitution",
    "scientific validation of supplied continuation licences or identity criteria",
    "certification that observed implementation treatment represents all operational identity behavior",
    "general source-code analysis method",
    "general entity-resolution method",
    "store-level conflation analysis for declared-distinct referents",
    "identity behavior lacking a finite record-indexed encoding",
    "adjudication among causal or normative interpretations",
    "determination of legal authority or legal correctness",
    "determination of responsibility or institutional legitimacy",
    "complete provenance standard",
    "replacement for existing record stores",
    "production data format specification",
    "binding implementation standard",
    "lower- or upper-bound claims about scientifically distinct identity regimes",
    "completeness claim for transformation families",
    "general theory of accountability",
    "domain ontology design",
]

# === Citation ===

[citation]
cff = "CITATION.cff"
preferred = "paper"

# === Traceability ===

[traceability]
identifier_map = "none"
